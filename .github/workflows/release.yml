name: release

# Run by hand: Actions > release > Run workflow, on the default branch, after the
# "chore(release): version X.Y.Z" PR has merged (see "Releasing" in the README).
# Creates the tag vX.Y.Z and the GitHub release, with the notes taken from CHANGELOG.md.
on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: package.json and plugin.json carry the same version
        run: node scripts/sync-plugin-version.mjs --check
      - name: Warn about unreleased changesets
        run: |
          pending="$(find .changeset -name '*.md' ! -name README.md)"
          if [ -n "$pending" ]; then
            echo "::warning::Unreleased changesets are still in .changeset/ and will not be in this release: $pending"
          fi
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::error::${tag} already exists; run pnpm run version to bump the version first"
            exit 1
          fi
          node scripts/release-notes.mjs "$version" > notes.md
          gh release create "$tag" --repo "$REPO" --target "$SHA" --title "$tag" --notes-file notes.md
