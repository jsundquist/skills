name: scorecard

on:
  branch_protection_rule:
  push:
    branches: [{{branch}}]
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: {{pin:actions/checkout}}
        with:
          persist-credentials: false
      - uses: {{pin:ossf/scorecard-action}}
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: {{publish}} # true only for public repos
      - uses: {{pin:github/codeql-action/upload-sarif}}
        with:
          sarif_file: results.sarif
