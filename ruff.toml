target-version = "py311"  # the oldest Python the scripts support (3.9 and 3.10 are end of life)
extend-exclude = ["node_modules"]

[lint]
# Real mistakes (unused names, syntax errors) and import order. Style is left alone on purpose.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Importing a check module registers its checks, so this import order is the order checks run and print in.
"skills/repo-supply-chain-check/scripts/audit.py" = ["I001"]
